name: Validate release

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci --no-audit --no-fund
      - run: npm run validate-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validate-release-evidence
          path: |
            artifacts/validation/
            artifacts/sbom/
          retention-days: 30

  container-validate:
    name: Container validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/container-validate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-validate-evidence
          path: artifacts/container-validation/
          retention-days: 30
