name: Validate release

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci --no-audit --no-fund
      - run: npm run validate-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validate-release-evidence
          path: |
            artifacts/validation/
            artifacts/sbom/
          retention-days: 30

  container-validate:
    name: Container validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/container-validate.sh
      - run: bash scripts/deploy-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-validate-evidence
          path: artifacts/container-validation/
          retention-days: 30

  opensandbox-integration:
    name: OpenSandbox integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: mkdir -p artifacts/opensandbox-integration
      - name: Generate Docker-mode OpenSandbox config
        run: |
          docker run --rm \
            -v "$PWD/artifacts/opensandbox-integration:/config" \
            opensandbox/server:v0.2.1@sha256:a41670fa956864f116b9db696bd8d0781b6c709be9cac1e66e2981740b1fbeb4 \
            init-config /config/sandbox.toml --example docker --force
          perl -0pi -e 's/host = "127\.0\.0\.1"/host = "0.0.0.0"/' artifacts/opensandbox-integration/sandbox.toml
          perl -0pi -e 's/\[docker\]\nnetwork_mode = "bridge"/[docker]\nnetwork_mode = "bridge"\nhost_ip = "host.docker.internal"/' artifacts/opensandbox-integration/sandbox.toml
          grep -E 'host = "0.0.0.0"|type = "docker"|host_ip = "host.docker.internal"|execd_image|image = "opensandbox/egress' artifacts/opensandbox-integration/sandbox.toml
      - name: Pre-pull pinned sandbox image
        run: docker pull opensandbox/code-interpreter:v1.1.0@sha256:133a3c1720dd52291a019740c2987e7164ea6de79e23d8198798e58950ae2e6e
      - name: Start pinned OpenSandbox server
        run: |
          docker run -d --name opensandbox-server \
            -p 8080:8080 \
            --add-host host.docker.internal:host-gateway \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/artifacts/opensandbox-integration/sandbox.toml:/etc/opensandbox/config.toml:ro" \
            -e DOCKER_HOST=unix:///var/run/docker.sock \
            -e OPENSANDBOX_INSECURE_SERVER=YES \
            opensandbox/server:v0.2.1@sha256:a41670fa956864f116b9db696bd8d0781b6c709be9cac1e66e2981740b1fbeb4
      - name: Wait for OpenSandbox server
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs opensandbox-server | tee artifacts/opensandbox-integration/server.log
          exit 1
      - name: Run OpenSandbox integration tests
        env:
          EAP_SANDBOX_RUNTIME: opensandbox
          EAP_OPENSANDBOX_URL: http://127.0.0.1:8080
        run: npx vitest run tests/integration/opensandbox.test.ts --pool=forks
      - name: Capture OpenSandbox logs
        if: always()
        run: docker logs opensandbox-server > artifacts/opensandbox-integration/server.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opensandbox-integration-evidence
          path: |
            artifacts/opensandbox-integration/
            artifacts/audit/
          retention-days: 30
